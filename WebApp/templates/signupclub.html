{% extends "ms3main.html" %} {% block title %}Club Sign Up{% endblock %}

{% block content %}

<form method="POST">
    <h1 align="center">Club Sign Up</h1>

    <div class="form-group">
        <label for="enid">England Netball ID:</label>
        <input type="text" class="form-control" id="enid" name="enid" placeholder="Enter your England Netball ID" required>
    </div>
    <div class="form-group">
        <label for="first_name">First Name:</label>
        <input type="text" class="form-control" id="first_name" name="first_name" placeholder="Enter your first name" required>
    </div>
    <div class="form-group">
        <label for="surname">Surname:</label>
        <input type="text" class="form-control" id="surname" name="surname" placeholder="Enter your surname" required>
    </div>
    <div class="form-group">
        <label for="club">Club:</label>
        <input type="text" class="form-control" id="club" name="club" placeholder="Enter your club Name" required>
    </div>
    <div class="form-group">
        <label for="area">Area:</label>
        <input type="text" class="form-control" id="area" name="area" placeholder="Enter your Regional Area" required>
    </div>
    <div class="form-group">
        <label for="city">City:</label>
        <input type="text" class="form-control" id="city" name="city" placeholder="Enter your town/city" required>
    </div>
    <br>
    <button type="submit" class="btn btn-primary">Sign Up</button>
</form>
{% endblock %}
