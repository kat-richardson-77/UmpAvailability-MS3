{% extends "ms3main.html" %} {% block title %}Umpire Sign Up{% endblock %}

{% block content %}
<h1>Umpire Sign Up</h1>
<form>
    <label for="enid">England Netball ID:</label>
    <input type="text" id="enid" name="enid" required>
    <br>
    <label for="first_name">First Name:</label>
    <input type="text" id="first_name" name="first_name" required>
    <br>
    <label for="surname">Surname:</label>
    <input type="text" id="surname" name="surname" required>
    <br>
    <label for="award">Award:</label>
    <input type="text" id="award" name="award" required>
    <br>
    <label for="area">Area:</label>
    <input type="text" id="area" name="area" required>
    <br>
    <label for="city">City:</label>
    <input type="text" id="city" name="city" required>
    <br>
    <button type="submit">Sign Up</button>
</form>
{% endblock %}
