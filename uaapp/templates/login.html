{% extends "ms3main.html" %} {% block title %}Login{% endblock %}

{% block content %}


<form method="POST">
    <h1 align="center">Login</h1>
    <div class="form-group">
    <label for="enid">England Netball ID:</label>
    <input type="text" class="form-control" id="enid" name="enid" placeholder="Enter your England Netball ID" required>
    </div>
    <div class="form-group">
    <label for="surname">Surname:</label>
    <input type="text" class="form-control" id="surname" name="surname" placeholder="Enter your surname" required>
    </div>
    <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
    </div>

    <br>
    <button type="submit" class="btn btn-primary">Login</button>

</form>

{% endblock %}
